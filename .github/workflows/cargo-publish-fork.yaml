name: Publish obeli-sk fork to crates.io

on:
  push:
    tags:
      - "obeli-sk-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Publish obeli-sk-refinery-core
      run: cargo publish -p obeli-sk-refinery-core --token ${{ secrets.CRATES_TOKEN }}

    - name: Wait for crates.io index update
      run: sleep 30

    - name: Publish obeli-sk-refinery-macros
      run: cargo publish -p obeli-sk-refinery-macros --token ${{ secrets.CRATES_TOKEN }}

    - name: Wait for crates.io index update
      run: sleep 30

    - name: Publish obeli-sk-refinery
      run: cargo publish -p obeli-sk-refinery --token ${{ secrets.CRATES_TOKEN }}
